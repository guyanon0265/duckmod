name: Bug Report
description: Describe an issue found in the mod
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please try to be descriptive so the bug is easier to reproduce and fix.
        Attaching relevant logs is appreciated.

  - type: input
    id: mc-version
    attributes:
      label: Minecraft Version
      description: The Minecraft version the bug occurred on
      placeholder: "26.1"
    validations:
      required: true

  - type: input
    id: mod-version
    attributes:
      label: Mod Version
      description: The mod version the bug occurred on
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      description: The platform the bug occurred on
      placeholder: "Windows 10, MacOS 26, etc"
    validations:
      required: true

  - type: dropdown
    id: loader
    attributes:
      label: Modloader
      description: The modloader the bug occurred on
      options:
        - -Select-
        - Fabric
        - NeoForge
    validations:
      required: true

  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: Describe the bug
    validations:
      required: true

  - type: textarea
    id: bug-reproduction
    attributes:
      label: Steps to Reproduce
      description: Describe how to reproduce the bug
    validations:
      required: true

  - type: dropdown
    id: bug-type
    attributes:
      label: Severity
      description: Please choose the severity of the bug
      options:
        - -Select-
        - Critical - Game crashes due to issue in mod
        - High - Mod behaves incorrectly or causes game to behave incorrectly
        - Low - Mod has issues that do not affect gameplay
    validations:
      required: true
